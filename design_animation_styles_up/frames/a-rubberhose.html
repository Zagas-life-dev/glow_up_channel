<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head><body>
<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="boil"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
  <g id="glove"><path d="M-34,-8 C-40,-40 -10,-52 0,-36 C8,-56 40,-46 34,-14 C52,-6 46,26 24,30 C10,44 -24,42 -30,24 C-50,18 -50,-4 -34,-8Z" fill="#fff" stroke="#0B1222" stroke-width="8" stroke-linejoin="round"/><path d="M-8,-30 L-6,-4 M10,-32 L8,-4" stroke="#0B1222" stroke-width="5" stroke-linecap="round"/></g>
  <g id="shoe"><path d="M-70,0 C-70,-40 -10,-46 20,-30 C60,-34 80,-10 76,10 L-70,10Z" fill="#0B1222"/><ellipse cx="40" cy="-20" rx="14" ry="7" fill="#fff" opacity=".6"/></g>
  <g id="card">
    <rect x="-120" y="-78" width="240" height="156" rx="22" fill="#fff" stroke="#0B1222" stroke-width="8"/>
    <rect x="-120" y="-78" width="240" height="50" rx="22" fill="#FF6700" stroke="#0B1222" stroke-width="8"/>
    <rect x="-112" y="-40" width="224" height="14" fill="#FF6700"/>
    <circle cx="-48" cy="12" r="12" fill="#0B1222"/><circle cx="48" cy="12" r="12" fill="#0B1222"/><circle cx="-44" cy="8" r="4" fill="#fff"/><circle cx="52" cy="8" r="4" fill="#fff"/>
    <path d="M-22,40 Q0,58 22,40" fill="none" stroke="#0B1222" stroke-width="7" stroke-linecap="round"/>
  </g>
</defs>
<rect width="1080" height="1920" fill="#F6EBD9"/>
<!-- vignette rings, 1930s -->
<g filter="url(#boil)">
<g transform="translate(540 1000)" opacity=".9">
  <g fill="#FF6700" opacity=".22">
    <path d="M0,0 L-120,-1000 L120,-1000Z"/><path d="M0,0 L-120,-1000 L120,-1000Z" transform="rotate(30)"/><path d="M0,0 L-120,-1000 L120,-1000Z" transform="rotate(60)"/><path d="M0,0 L-120,-1000 L120,-1000Z" transform="rotate(90)"/><path d="M0,0 L-120,-1000 L120,-1000Z" transform="rotate(-30)"/><path d="M0,0 L-120,-1000 L120,-1000Z" transform="rotate(-60)"/><path d="M0,0 L-120,-1000 L120,-1000Z" transform="rotate(-90)"/><path d="M0,0 L-120,-1000 L120,-1000Z" transform="rotate(120)"/><path d="M0,0 L-120,-1000 L120,-1000Z" transform="rotate(-120)"/><path d="M0,0 L-120,-1000 L120,-1000Z" transform="rotate(150)"/><path d="M0,0 L-120,-1000 L120,-1000Z" transform="rotate(-150)"/><path d="M0,0 L-120,-1000 L120,-1000Z" transform="rotate(180)"/>
  </g>
</g>
<!-- ground -->
<path d="M0,1660 Q540,1636 1080,1660 L1080,1920 L0,1920Z" fill="#0B1222"/>
<path d="M120,1700 h120 M380,1760 h200 M760,1690 h150" stroke="#F6EBD9" stroke-width="6" stroke-linecap="round" opacity=".35"/>

<!-- caption plate -->
<g transform="translate(540 250) rotate(-3)">
  <rect x="-380" y="-70" width="760" height="140" rx="30" fill="#0B1222"/>
  <text text-anchor="middle" y="18" font-size="54" fill="#F6EBD9" class="d">Wait… LOOK <tspan fill="#FF6700">UP!</tspan></text>
</g>

<!-- running cards with noodle legs -->
<g transform="translate(220 560) rotate(-12)">
  <path d="M-200,-20 h-90 M-190,20 h-130 M-200,60 h-70" stroke="#0B1222" stroke-width="7" stroke-linecap="round" opacity=".5"/>
  <path d="M-40,76 C-50,120 -90,130 -110,150" fill="none" stroke="#0B1222" stroke-width="10" stroke-linecap="round"/>
  <path d="M40,76 C60,110 70,140 110,130" fill="none" stroke="#0B1222" stroke-width="10" stroke-linecap="round"/>
  <use href="#shoe" transform="translate(-118 160) scale(.45) scale(-1 1)"/><use href="#shoe" transform="translate(120 140) scale(.45) rotate(-20)"/>
  <use href="#card"/><text x="0" y="-44" text-anchor="middle" font-size="22" fill="#fff" class="s">SCHOLARSHIP</text>
</g>
<g transform="translate(560 470) rotate(6)">
  <path d="M-150,-30 h-70 M-150,10 h-110" stroke="#0B1222" stroke-width="7" stroke-linecap="round" opacity=".5"/>
  <path d="M-40,76 C-30,120 -60,150 -90,160" fill="none" stroke="#0B1222" stroke-width="10" stroke-linecap="round"/>
  <path d="M40,76 C50,120 90,130 120,150" fill="none" stroke="#0B1222" stroke-width="10" stroke-linecap="round"/>
  <use href="#shoe" transform="translate(-96 166) scale(.45) scale(-1 1)"/><use href="#shoe" transform="translate(126 156) scale(.45)"/>
  <use href="#card"/><text x="0" y="-44" text-anchor="middle" font-size="22" fill="#fff" class="s">JOB OFFER</text>
</g>
<g transform="translate(910 880) rotate(14) scale(.85)">
  <path d="M-40,76 C-60,110 -80,140 -100,140" fill="none" stroke="#0B1222" stroke-width="10" stroke-linecap="round"/>
  <path d="M40,76 C40,120 70,150 100,170" fill="none" stroke="#0B1222" stroke-width="10" stroke-linecap="round"/>
  <use href="#shoe" transform="translate(-110 148) scale(.45) scale(-1 1)"/><use href="#shoe" transform="translate(110 178) scale(.45)"/>
  <use href="#card"/><text x="0" y="-44" text-anchor="middle" font-size="22" fill="#fff" class="s">GRANT</text>
  <!-- sweat drop / surprise -->
  <path d="M140,-90 q14,24 0,34 q-14,-10 0,-34z" fill="#0B1222"/>
</g>

<!-- side character left: slumped -->
<g transform="translate(190 1300)">
  <path d="M-80,40 C-90,-120 90,-120 80,40 C70,150 -70,150 -80,40Z" fill="#fff" stroke="#0B1222" stroke-width="9"/>
  <path d="M-30,140 C-40,200 -40,250 -40,290" fill="none" stroke="#0B1222" stroke-width="11" stroke-linecap="round"/>
  <path d="M30,140 C40,200 40,250 40,290" fill="none" stroke="#0B1222" stroke-width="11" stroke-linecap="round"/>
  <use href="#shoe" transform="translate(-50 300) scale(.6) scale(-1 1)"/><use href="#shoe" transform="translate(54 300) scale(.6)"/>
  <circle cx="10" cy="-150" r="92" fill="#fff" stroke="#0B1222" stroke-width="9"/>
  <path d="M-30,-130 q14,10 28,0 M30,-130 q14,10 28,0" fill="none" stroke="#0B1222" stroke-width="8" stroke-linecap="round"/>
  <path d="M0,-90 q16,-8 30,0" fill="none" stroke="#0B1222" stroke-width="7" stroke-linecap="round"/>
  <rect x="-20" y="-20" width="70" height="110" rx="12" fill="#0B1222"/><rect x="-12" y="-10" width="54" height="86" rx="6" fill="#5a6280"/>
  <path d="M-70,0 C-60,60 -40,60 -20,40" fill="none" stroke="#0B1222" stroke-width="10" stroke-linecap="round"/>
  <use href="#glove" transform="translate(-10 50) scale(.7)"/>
  <text x="80" y="-250" font-size="40" class="d" fill="#0B1222" opacity=".5">z</text><text x="110" y="-290" font-size="30" class="d" fill="#0B1222" opacity=".4">z</text>
</g>
<!-- side character right -->
<g transform="translate(890 1300)">
  <path d="M-80,40 C-90,-120 90,-120 80,40 C70,150 -70,150 -80,40Z" fill="#fff" stroke="#0B1222" stroke-width="9"/>
  <path d="M-30,140 C-40,200 -40,250 -40,290" fill="none" stroke="#0B1222" stroke-width="11" stroke-linecap="round"/>
  <path d="M30,140 C40,200 40,250 40,290" fill="none" stroke="#0B1222" stroke-width="11" stroke-linecap="round"/>
  <use href="#shoe" transform="translate(-50 300) scale(.6) scale(-1 1)"/><use href="#shoe" transform="translate(54 300) scale(.6)"/>
  <circle cx="-10" cy="-150" r="92" fill="#fff" stroke="#0B1222" stroke-width="9"/>
  <path d="M-58,-130 q14,10 28,0 M2,-130 q14,10 28,0" fill="none" stroke="#0B1222" stroke-width="8" stroke-linecap="round"/>
  <path d="M-40,-88 q16,-8 30,0" fill="none" stroke="#0B1222" stroke-width="7" stroke-linecap="round"/>
  <rect x="-50" y="-20" width="70" height="110" rx="12" fill="#0B1222"/><rect x="-42" y="-10" width="54" height="86" rx="6" fill="#5a6280"/>
  <path d="M70,0 C60,60 40,60 20,40" fill="none" stroke="#0B1222" stroke-width="10" stroke-linecap="round"/>
  <use href="#glove" transform="translate(10 50) scale(.7)"/>
</g>

<!-- HERO: stretched take, arms flung -->
<g transform="translate(540 1190)">
  <!-- legs: knees bent, springing -->
  <path d="M-40,180 C-90,260 -20,320 -70,400" fill="none" stroke="#0B1222" stroke-width="14" stroke-linecap="round"/>
  <path d="M40,180 C90,260 20,320 70,400" fill="none" stroke="#0B1222" stroke-width="14" stroke-linecap="round"/>
  <use href="#shoe" transform="translate(-90 410) scale(.85) scale(-1 1)"/><use href="#shoe" transform="translate(90 410) scale(.85)"/>
  <!-- stretched body -->
  <path d="M-100,60 C-120,-150 120,-150 100,60 C90,220 -90,220 -100,60Z" fill="#FF6700" stroke="#0B1222" stroke-width="10"/>
  <path d="M-60,40 q60,30 120,0" fill="none" stroke="#0B1222" stroke-width="7" stroke-linecap="round" opacity=".5"/>
  <!-- left arm flung up -->
  <path d="M-90,-40 C-200,-80 -170,-230 -250,-300" fill="none" stroke="#0B1222" stroke-width="13" stroke-linecap="round"/>
  <use href="#glove" transform="translate(-262 -320) rotate(-30)"/>
  <!-- right arm holding phone high -->
  <path d="M90,-40 C200,-90 160,-250 230,-330" fill="none" stroke="#0B1222" stroke-width="13" stroke-linecap="round"/>
  <!-- phone + erupting arrow -->
  <g transform="translate(240 -380) rotate(12)">
    <path d="M0,-40 L0,-260" stroke="#FF6700" stroke-width="36" stroke-linecap="round"/>
    <path d="M-70,-220 L0,-320 L70,-220Z" fill="#FF6700" stroke="#0B1222" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-60,-120 l-40,-20 M60,-140 l40,-20 M-50,-200 l-46,-6 M50,-210 l46,-6" stroke="#0B1222" stroke-width="7" stroke-linecap="round"/>
    <rect x="-44" y="-50" width="88" height="140" rx="14" fill="#0B1222"/><rect x="-34" y="-38" width="68" height="112" rx="8" fill="#FF6700"/>
  </g>
  <use href="#glove" transform="translate(234 -330) rotate(20)"/>
  <!-- head, stretched up -->
  <g transform="translate(0 -250)">
    <ellipse cx="0" cy="0" rx="140" ry="160" fill="#fff" stroke="#0B1222" stroke-width="10"/>
    <!-- pie-cut eyes popped -->
    <ellipse cx="-48" cy="-30" rx="34" ry="62" fill="#0B1222"/><ellipse cx="48" cy="-30" rx="34" ry="62" fill="#0B1222"/>
    <path d="M-48,-30 L-30,-80 L-18,-50Z M48,-30 L66,-80 L78,-50Z" fill="#fff"/>
    <!-- huge O mouth -->
    <ellipse cx="0" cy="80" rx="42" ry="52" fill="#0B1222"/><ellipse cx="0" cy="100" rx="24" ry="18" fill="#FF6700"/>
    <!-- take lines -->
    <path d="M-180,-150 l-40,-40 M180,-150 l40,-40 M0,-200 l0,-56 M-110,-200 l-20,-46 M110,-200 l20,-46" stroke="#0B1222" stroke-width="9" stroke-linecap="round"/>
  </g>
</g>
</g>
<text x="540" y="1860" text-anchor="middle" font-size="26" fill="#F6EBD9" class="s" opacity=".7">A · Rubber-hose</text>
</svg></body></html>
