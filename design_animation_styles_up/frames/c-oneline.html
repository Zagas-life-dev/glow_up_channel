</g>
<!-- phone screen glow -->
<circle cx="750" cy="1170" r="70" fill="#FF6700" opacity=".14"/>
<text x="540" y="1860" text-anchor="middle" font-size="26" fill="#F6EBD9" class="s" opacity=".6">C · One continuous line</text>
